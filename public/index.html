<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>San Diego Polo</title>
<!-- Para que agregada a la pantalla de inicio quede como una app: con el
     escudo, a pantalla completa y sin la barra del navegador. -->
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/iconos/logo-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/iconos/logo-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="San Diego">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bitter:wght@400;600;700&display=swap">
<style>
  :root {
    --ground: #ffffff;      /* el fondo de la app y de las tarjetas */
    --surface: #f6f8fb;     /* lo que va ADENTRO de una tarjeta */
    --raised: #eef2f8;      /* el encabezado y los renglones de encabezado */
    --line: #dde3ec;
    --linea-suave: #eef2f8; /* la raya entre dos renglones de una misma lista */
    --ink: #16202e;
    --muted: #6b7891;
    --teal: #00897a;        /* más oscuro que el de la v1: sobre blanco tiene que leerse */
    --gold: #a07722;
    --rojo: #c62828;
    --azul: #1d4ed8;
    --blanco: #475569;      /* el equipo blanco, en un gris que se lea sobre blanco */
    --colorado: #b91c1c;
    --sobre-color: #ffffff; /* el texto arriba de un fondo de color */
    /* Dos tipografías, las dos de fundiciones porteñas: Bitter (Huerta
       Tipográfica) para los nombres propios y los títulos, Archivo
       (Omnibus-Type) para la interfaz y sobre todo para los números, que en
       serif nunca alinean en columna. */
    --serif: Bitter, Georgia, 'Times New Roman', serif;
    --sans: Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 14px; line-height: 1.45;
    font-variant-numeric: tabular-nums;
    -webkit-text-size-adjust: 100%;
  }
  a { color: var(--teal); }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 14px 48px; }
  .hidden { display: none !important; }

  /* El encabezado va en blanco y el gris baja a las solapas: arriba no se toca
     nada, y las solapas —que son lo único que se toca todo el tiempo— quedan
     marcadas como una barra. */
  header {
    background: var(--ground);
    border-bottom: 1px solid var(--line);
  }
  /* La franja de la copia de prueba. Va arriba de todo, ocupa el ancho entero y
     usa el naranja que no aparece en ninguna otra parte de la app: la única
     forma de que nadie confunda una app con la otra es que se vea antes que el
     escudo. */
  #franja-prueba {
    background: #9a3412; color: #fff;
    padding: 7px 14px; text-align: center;
    font-size: 12px; letter-spacing: 1.2px; line-height: 1.5;
  }
  #franja-prueba b { font-weight: 700; }
  #franja-prueba span {
    display: block; letter-spacing: 0.2px; font-size: 12px;
    color: rgba(255,255,255,.85); text-transform: none;
  }
  /* Todo apoya abajo, así el escudo y el nombre comparten piso sea cual sea el
     tamaño del escudo. La pastilla de ADMIN es la excepción: va centrada. */
  .head-in {
    max-width: 640px; margin: 0 auto; padding: 13px 14px;
    display: flex; align-items: flex-end; gap: 11px;
  }
  .head-in > #chip-admin { align-self: center; }
  /* El escudo apoya en la misma línea que el nombre de abajo, no centrado
     contra el bloque de texto.
     Los 2.5px son lo que sobra debajo de las letras adentro de su renglón —el
     aire que deja la interlínea más el lugar de las colas de las letras—: sin
     eso el escudo se alinearía con la caja y quedaría 2.5px más abajo que la
     última letra, que es lo que el ojo mira. */
  .mark {
    width: 40px; height: 40px; flex-shrink: 0; object-fit: cover;
    /* 2.5px lo dejarían al ras de la última letra; con 0.5 baja 2 px de ahí. */
    align-self: flex-end; margin-bottom: 0.5px;
  }
  .brand { flex: 1; }
  .brand b { display: block; font-family: var(--serif); color: var(--teal); letter-spacing: 1.5px; font-size: 16px; }
  .brand span { display: block; color: var(--muted); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; }

  /* El título de la pantalla, en serif y a tinta plena. */
  h1.titulo { font-family: var(--serif); font-size: 20px; font-weight: 600; margin: 18px 0 12px; }
  /* Los títulos de sección: chicos, dorados y en versalitas. Antes eran del
     mismo tamaño que el de la pantalla y competían con él. */
  h2 {
    font-family: var(--sans); font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase;
    color: var(--gold); font-weight: 700; margin: 22px 0 9px;
  }
  h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: 1.5px; font-weight: 700; }

  .insignia { font-size: 11px; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
  .meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  /* Adentro de un renglón de lista el `display:block` del `span` le ganaba al
     flex y la categoría quedaba pegada al handicap. */
  .quien .meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  /* Socio o temporario no merece una pastilla de color al lado del nombre. */
  .categoria { font-size: 9.5px; letter-spacing: 1.1px; text-transform: uppercase; color: var(--muted); }

  /* Tres niveles y nada más: la página y la tarjeta son blancas —la tarjeta
     con un filete— y el gris queda para lo que va adentro de una tarjeta. */
  .card { background: var(--ground); border: 1px solid var(--line); border-radius: 10px; }
  .card.p { padding: 14px; }
  .card.relleno { background: var(--surface); }

  input[type="text"], input[type="tel"], input[type="date"], input[type="time"],
  input[type="number"], textarea {
    width: 100%; background: var(--ground); border: 1px solid var(--line); border-radius: 9px;
    padding: 12px 14px; color: var(--ink); font: inherit; font-size: 15px; min-height: 48px;
  }
  textarea { min-height: 62px; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: var(--teal); }

  .campo { display: block; margin-bottom: 12px; }
  .campo > span {
    display: block; font-size: 10px; letter-spacing: 1.8px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 6px;
  }
  .campo:last-child { margin-bottom: 0; }
  .grilla-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips.tres { display: grid; grid-template-columns: repeat(3, 1fr); }
  .chip {
    flex: 1; min-width: 60px; min-height: 48px; background: var(--ground);
    border: 1px solid var(--line); border-radius: 9px; color: var(--muted);
    font: inherit; font-size: 14px; cursor: pointer; padding: 10px 8px;
  }
  .chip[aria-pressed="true"] { border-color: var(--teal); color: var(--ink); background: rgba(0,137,122,.09); }
  .chip em { display: block; font-style: normal; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .chip.color { letter-spacing: 1.2px; font-size: 12px; }
  .chip.color.azul[aria-pressed="true"] { border-color: var(--azul); background: rgba(29,78,216,.09); color: var(--azul); }
  .chip.color.blanco[aria-pressed="true"] { border-color: var(--blanco); background: rgba(71,85,105,.09); color: var(--blanco); }
  .chip.color.colorado[aria-pressed="true"] { border-color: var(--colorado); background: rgba(185,28,28,.09); color: var(--colorado); }
  .chip.color.bicolor[aria-pressed="true"] { border-color: var(--gold); background: rgba(160,119,34,.10); color: var(--gold); }

  .pista { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
  .pista + .campo { margin-top: 14px; }

  /* Un rótulo chico para separar dos bloques de números sin gastar un título
     entero: dice de qué son los que vienen abajo. */
  .apartado {
    font-size: 11px; font-weight: 700; letter-spacing: .10em; text-transform: uppercase;
    color: var(--muted); margin: 16px 0 6px;
  }

  .lista { display: flex; flex-direction: column; gap: 6px; }
  /* Una lista de renglones no son N tarjetas sueltas: es UNA tarjeta con
     renglones adentro, separados por una raya. Entra el doble en la pantalla
     y el ojo puede bajar por una columna. */
  .lista.tabla { gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .lista.tabla > .quien { border: none; border-radius: 0; border-bottom: 1px solid var(--linea-suave); min-height: 50px; }
  .lista.tabla > .quien:last-child { border-bottom: none; }
  .lista.tabla > .quien.puesto { border-left: 3px solid transparent; }

  /* --- el plantel: cada jugador se toca y se abre para corregirlo --- */
  /* El renglón dejó de ser hijo directo de la lista —abajo le cuelga el
     formulario—, así que la línea que los separa se la pone él. */
  .lista.tabla.plantel > .renglon-plantel:not(:last-child) { border-bottom: 1px solid var(--linea-suave); }
  /* Va con el nombre de la lista adelante para ganarle a `.quien`, que define
     su borde y su redondeo más abajo: acá el renglón no es una tarjeta. */
  .lista.tabla.plantel .fila-jugador {
    width: 100%; min-height: 50px; border: none; border-radius: 0; background: none;
    font: inherit; color: inherit; text-align: left;
  }
  .lista.tabla.plantel .fila-jugador.abierta { background: rgba(0,137,122,.06); }
  .fila-jugador .flechita { color: var(--muted); flex-shrink: 0; margin-left: 2px; }
  .desplegado.corregir {
    border: none; border-radius: 0; margin: 0;
    background: var(--surface); padding: 14px;
    border-top: 1px solid var(--linea-suave);
  }
  .desplegado.corregir .acciones { margin-top: 14px; }
  /* La aclaración chica debajo de un casillero: para qué es ese número. */
  .pista-campo { display: block; font-style: normal; font-size: 10.5px; color: var(--muted); margin-top: 4px; }
  /* Un tilde con su explicación al lado, no arriba: es una sola decisión. */
  .campo.tilde { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .campo.tilde input { width: auto; flex: none; }
  .campo.tilde > span { margin: 0; font-size: 13px; text-transform: none; letter-spacing: 0; }
  .campo.tilde em { flex-basis: 100%; font-style: normal; font-size: 10.5px; color: var(--muted); margin-left: 24px; }
  .cabeza-tabla {
    display: flex; align-items: center; gap: 10px; padding: 7px 14px;
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .quien {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: var(--ground); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 14px; min-height: 50px; cursor: pointer; font: inherit; color: var(--ink);
  }
  .quien.estatico { cursor: default; }
  .quien.apagado { opacity: .45; }
  .quien.compacto { min-height: 44px; padding: 4px 14px; }
  .quien.compacto b { font-size: 14px; }
  .veces { font-size: 13px; color: var(--ink); font-weight: 600; }
  /* Las columnas de números de una tabla: siempre el mismo ancho, siempre
     alineadas a la derecha, para poder bajar con el ojo por una sola. */
  .col-chico { width: 38px; text-align: right; font-size: 12.5px; flex-shrink: 0; }
  .col-chico.ancha { width: 52px; color: var(--muted); font-size: 11px; }
  .col-chico.fuerte { color: var(--teal); font-weight: 600; font-size: 14px; }
  .col-chico.aviso-carga { color: var(--gold); font-weight: 600; }
  .cabeza-tabla .col-chico { font-size: 9px; font-weight: 700; letter-spacing: 1.1px; color: var(--muted); }
  .cruz-fila { display: inline-block; vertical-align: -1px; margin-right: 3px; }
  /* El punto de "esos chukkers no los montaste vos": los hizo alguien del
     grupo. La carga del caballo es la misma; lo que cambia es quién lo vio. */
  .punto-ajeno {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--gold); margin-right: 6px; vertical-align: 2px;
  }
  /* El asterisco no es un punto sino un signo, así que va como texto y no
     como caja: una caja con medidas propias se le escapa del renglón. */
  .marca-afuera { color: var(--gold); font-weight: 700; margin-right: 3px; }
  .quien b { display: block; font-family: var(--serif); font-size: 14.5px; font-weight: 600; }
  .quien > span > span { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }
  .marca { font-size: 10px; letter-spacing: 1px; color: var(--gold); border: 1px solid rgba(160,119,34,.45); border-radius: 4px; padding: 3px 7px; white-space: nowrap; }
  .marca.listo { color: var(--teal); border-color: rgba(0,137,122,.45); }
  .marca.pendiente { color: var(--muted); border-color: var(--line); }
  .quien .hcp { font-size: 13px; color: var(--muted); min-width: 26px; text-align: right; }
  .quien .orden {
    width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; font-size: 10px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    background: var(--linea-suave); color: #9aa5b8;
  }
  .quien.puesto .orden { background: var(--muted); color: var(--sobre-color); }
  /* La banda de handicap, adentro de la tabla del plantel. */
  .banda {
    padding: 6px 14px; background: var(--surface);
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    font-size: 9.5px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted);
  }
  .lista.tabla > .banda:first-child { border-top: none; }
  .quien.puesto.azul { border-color: var(--azul); }
  .quien.puesto.azul .orden { background: var(--azul); }
  .quien.puesto.blanco { border-color: var(--blanco); }
  .quien.puesto.blanco .orden { background: var(--blanco); }
  .quien.puesto.colorado { border-color: var(--colorado); }
  .quien.puesto.colorado .orden { background: var(--colorado); }
  .quien.puesto.bicolor { border-color: var(--gold); }
  .quien.puesto.bicolor .orden { background: var(--gold); }

  .pin {
    width: 100%; text-align: center; letter-spacing: 16px; font-size: 30px; padding: 16px 14px 16px 30px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--ink);
    font-family: var(--sans); font-weight: 600; min-height: 68px;
  }
  .pin:focus { outline: none; border-color: var(--teal); }

  button.primary {
    width: 100%; background: var(--teal); color: var(--sobre-color); border: none; border-radius: 9px;
    padding: 15px; font: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer; min-height: 50px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  button.primary[disabled] { background: var(--surface); color: var(--muted); cursor: not-allowed; }
  /* Un solo botón lleno por pantalla: el resto son de contorno. */
  button.ghost {
    width: 100%; background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 9px;
    padding: 12px; font: inherit; font-size: 13.5px; cursor: pointer; min-height: 46px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  button.ghost svg { display: block; flex-shrink: 0; }
  button.primary svg { display: block; flex-shrink: 0; }
  button.ghost[disabled] { opacity: .45; cursor: not-allowed; }
  button.ghost:hover:not([disabled]) { color: var(--ink); border-color: var(--muted); }
  button.link { background: none; border: none; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; padding: 10px; text-decoration: underline; }
  button.peligro {
    width: 100%; background: var(--rojo); color: var(--sobre-color); border: none; border-radius: 9px;
    padding: 14px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; min-height: 50px;
  }
  button.peligro[disabled] { opacity: .5; cursor: not-allowed; }
  /* Borrar, cuando no es la acción principal de la pantalla: sigue siendo un
     enlace, pero en rojo para que no se toque de casualidad. */
  button.link.rojo { color: var(--rojo); }
  .acciones { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  .salir { text-align: center; margin-top: 26px; }
  /* Chiquita y apagada: está para consultarla, no para leerla. */
  .salir .version { font-size: 10.5px; color: var(--muted); margin-top: 8px; letter-spacing: .3px; }

  /* Con siete pestañas no entran de frente en un celular: se deslizan, y el
     degradé del borde avisa que hay más. El ícono va arriba del texto para
     que cada una ocupe lo menos posible de ancho. */
  /* El gris que antes tenía el encabezado. Va pegado arriba, sin el margen que
     lo separaba, para que se lea como una sola barra debajo del escudo. */
  /* Los -14px comen el padding de `.wrap`: así el gris llega a los dos bordes
     de la pantalla y la barra se lee entera, como el encabezado de arriba. */
  .barra-pestanas {
    position: relative; border-bottom: 1px solid var(--line); margin: 0 -14px;
    background: var(--raised);
  }
  /* El degradé que avisa que la fila sigue: ahora se funde contra el gris de la
     barra, no contra el blanco de la página. */
  .barra-pestanas::after {
    content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 30px;
    pointer-events: none;
    background: linear-gradient(to right, rgba(238,242,248,0), var(--raised));
  }
  .pestanas {
    display: flex; gap: 0;
    overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .pestanas::-webkit-scrollbar { display: none; }
  .pestana {
    flex: 1 0 auto; background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); font: inherit; font-size: 10.5px; padding: 8px 9px 7px; cursor: pointer;
    min-height: 52px; white-space: nowrap;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .pestana svg { width: 19px; height: 19px; display: block; }
  .pestana[aria-pressed="true"] { color: var(--teal); border-bottom-color: var(--teal); font-weight: 600; }

  .cabecera-hoja { margin-bottom: 14px; }
  .cabecera-hoja b { display: block; font-family: var(--serif); font-size: 19px; font-weight: 600; }
  .cabecera-hoja span { font-size: 12px; color: var(--muted); }
  /* Un equipo por columna: dos, o tres en las de 12. Puestos al lado se leen
     como en la planilla de papel, en vez de uno abajo del otro. */
  .equipos-tabla { display: grid; gap: 9px; }
  .equipos-tabla.dos { grid-template-columns: 1fr 1fr; }
  .equipos-tabla.tres { grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .equipo { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  /* El encabezado lleva el color del equipo y, a la derecha, su handicap: es
     el número que se mira para saber si están parejos. */
  .equipo .cab {
    display: flex; justify-content: space-between; align-items: baseline; gap: 4px;
    padding: 7px 9px; font-size: 9.5px; font-weight: 700; letter-spacing: 1.1px;
  }
  .equipo.azul .cab { background: rgba(29,78,216,.10); color: var(--azul); }
  .equipo.blanco .cab { background: rgba(71,85,105,.12); color: var(--blanco); }
  .equipo.colorado .cab { background: rgba(185,28,28,.10); color: var(--colorado); }
  .equipo.bicolor .cab { background: rgba(160,119,34,.10); color: var(--gold); }
  .equipo .cab b { font-family: var(--serif); font-size: 14px; font-weight: 700; color: var(--ink); }
  .equipo .cab b i { font-family: var(--sans); font-style: normal; font-size: 8.5px; color: var(--muted); margin-left: 2px; }
  .equipo .renglon {
    display: flex; justify-content: space-between; align-items: baseline; gap: 5px;
    padding: 7px 9px; border-top: 1px solid var(--linea-suave); font-size: 13px;
  }
  .equipo .renglon .nm { font-family: var(--serif); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .equipo .renglon.de-mas .nm { font-weight: 700; }
  .equipo .renglon em { font-style: normal; font-size: 11px; color: var(--muted); margin-left: auto; }
  .equipo .renglon .h { font-style: normal; font-size: 11.5px; color: var(--muted); flex-shrink: 0; margin-left: auto; }
  .equipo .renglon em + .h { margin-left: 5px; }
  /* El que entró a mano después del armado automático. */
  .equipo .renglon.nuevo { background: rgba(0,137,122,.09); }
  .equipo .renglon.nuevo .nm { color: var(--teal); }
  /* Tres columnas en un celular son angostas: COLORADO con su handicap al lado
     no entra. Se achica la letra, se aprieta el espaciado y el "hcp" chiquito
     se va: arriba de un número que ya está en una caja de equipo, sobra. */
  .equipos-tabla.tres .equipo .cab { padding: 6px 5px; font-size: 8.5px; letter-spacing: .5px; }
  .equipos-tabla.tres .equipo .cab b { font-size: 13px; }
  .equipos-tabla.tres .equipo .cab b i { display: none; }
  .equipos-tabla.tres .equipo .renglon { padding: 6px 5px; font-size: 12px; }
  .bicolor-caja { margin-top: 10px; border-color: rgba(160,119,34,.45); }
  .bicolor-caja .al-pie { padding: 6px 9px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--linea-suave); }
  h3.color.azul { color: var(--azul); }
  h3.color.blanco { color: var(--blanco); }
  h3.color.colorado { color: var(--colorado); }
  h3.color.bicolor { color: var(--gold); }

  /* --- anotación: quién juega el próximo día --- */
  /* El cartel de "ya estás": el tilde verde se ve antes de leer nada. */
  .anotado {
    display: flex; align-items: center; gap: 10px;
    background: rgba(0,137,122,.09); border: 1px solid var(--teal);
    border-radius: 10px; padding: 12px 14px; color: var(--teal);
  }
  .anotado b { display: block; font-family: var(--serif); font-size: 15px; color: var(--ink); }
  .anotado > div > span { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }
  .anotado button.link { flex-shrink: 0; padding: 6px 2px; }
  .quien.yo { background: rgba(0,137,122,.07); }
  .marca.azul { color: var(--azul); border-color: rgba(29,78,216,.4); }
  .marca.blanco { color: var(--blanco); border-color: rgba(71,85,105,.4); }
  .marca.colorado { color: var(--colorado); border-color: rgba(185,28,28,.4); }
  .marca.bicolor { color: var(--gold); border-color: rgba(160,119,34,.45); }
  /* JUEGO: el botón de la semana. Es el único que se toca sin mirar. */
  button.primary.grande { font-size: 17px; letter-spacing: 2px; padding: 17px; min-height: 58px; }

  /* Dos botones que caben en un renglón, para no empujar la lista hacia abajo. */
  .dos-botones { display: flex; gap: 8px; margin-top: 14px; }
  .dos-botones button { font-size: 12.5px; padding: 11px 6px; gap: 6px; }

  /* --- armar solo: los dos botones de dos renglones --- */
  .dos-autos { display: flex; gap: 8px; }
  .dos-autos button.auto {
    flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 9px;
    padding: 10px 8px; text-align: center; line-height: 1.25; font: inherit;
    color: var(--ink); cursor: pointer; min-height: 56px;
  }
  .dos-autos button.auto.puesto { border-color: var(--teal); background: rgba(0,137,122,.09); }
  .dos-autos button.auto.esperando { opacity: .5; }
  .dos-autos button.auto b { display: block; font-size: 12.5px; font-weight: 600; }
  .dos-autos button.auto em { display: block; font-style: normal; font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  /* El handicap de cada equipo mientras se cambia gente: se mueve en el toque. */
  .marcador-hcp { display: flex; gap: 8px; margin: 12px 0; }
  .marcador-hcp > div {
    flex: 1; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px;
    display: flex; justify-content: space-between; align-items: baseline; gap: 4px;
  }
  .marcador-hcp > div > span { font-size: 9.5px; font-weight: 700; letter-spacing: 1.1px; }
  .marcador-hcp > div > b { font-family: var(--serif); font-size: 17px; color: var(--ink); }
  .marcador-hcp > div > b i { font-family: var(--sans); font-style: normal; font-size: 8.5px; color: var(--muted); margin-left: 2px; }
  .marcador-hcp .azul { border-color: rgba(29,78,216,.35); color: var(--azul); }
  .marcador-hcp .blanco { border-color: rgba(71,85,105,.35); color: var(--blanco); }
  .marcador-hcp .colorado { border-color: rgba(185,28,28,.35); color: var(--colorado); }
  /* Va con `.quien.puesto` adelante para ganarle al color del equipo, que
     también pinta el círculo: acá el círculo es el botón de sacar. */
  .quien.puesto .orden.saca { background: var(--rojo); color: var(--sobre-color); font-size: 15px; }
  h2 em { font-style: normal; color: var(--muted); font-size: 11px; font-weight: 400; letter-spacing: .4px; text-transform: none; margin-left: 6px; }
  .franjas { margin-top: 12px; font-size: 13px; color: var(--muted); }
  .franjas div { padding: 2px 0; }
  .nota-hoja {
    margin-top: 12px; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font-size: 13px; white-space: pre-wrap;
  }

  /* --- mis caballos --- */
  select {
    width: 100%; background: var(--ground); border: 1px solid var(--line); border-radius: 9px;
    padding: 12px 14px; color: var(--ink); font: inherit; font-size: 15px; min-height: 48px;
    appearance: none;
  }
  select:focus { outline: none; border-color: var(--teal); }
  .fila { display: flex; gap: 8px; }
  .cabecera-jornada { display: flex; align-items: center; gap: 12px; }
  .cabecera-jornada b { display: block; font-family: var(--serif); font-size: 15px; font-weight: 600; }
  .cabecera-jornada span { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }
  .sello { font-size: 10px; letter-spacing: 1.2px; padding: 5px 10px; border-radius: 4px; font-weight: 700; }
  .sello.azul { background: rgba(29,78,216,.10); color: var(--azul); }
  .sello.blanco { background: rgba(71,85,105,.10); color: var(--blanco); }
  .sello.colorado { background: rgba(185,28,28,.10); color: var(--colorado); }
  .sello.bicolor { background: rgba(160,119,34,.10); color: var(--gold); }
  .sello.aap { background: rgba(147,51,234,.10); color: #c084fc; }

  /* --- la caballada compartida --- */
  /* El interruptor de arriba: mis caballos o los del grupo. */
  .chips.dos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .chip.grande { padding: 9px 8px; line-height: 1.2; }
  .chip.grande em { display: block; font-style: normal; font-size: 11px; color: var(--muted); margin-top: 2px; }
  /* El cartel de la invitación, arriba de todo: es lo primero que se contesta. */
  .invita {
    border: 1px solid var(--teal); background: rgba(0,137,122,.07);
    border-radius: 11px; padding: 14px; margin-top: 14px;
  }
  .invita b { display: block; font-family: var(--serif); font-size: 16px; font-weight: 600; margin-bottom: 5px; }
  .invita p { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
  .invita .dos-botones { margin-top: 0; }
  .invita .primary { padding: 12px; font-size: 14px; min-height: 44px; }
  /* El tilde de quién está en el grupo, y de a quién estás invitando. */
  .casilla {
    width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--line);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .casilla.puesta { background: var(--teal); border-color: var(--teal); }
  .casilla.esperando { border-color: var(--gold); border-style: dashed; }
  .falso-campo {
    width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 9px;
    padding: 12px 14px; font-size: 15px; color: var(--ink);
  }
  /* De quién es el caballo, abajo del nombre. */
  .cab-head b u { display: block; text-decoration: none; font-family: var(--sans); font-size: 10.5px; color: var(--muted); font-weight: 400; margin-top: 1px; }

  .caballo { background: var(--ground); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; }
  .caballo.usado { border-color: var(--teal); }
  .caballo.lesionado { border-color: var(--rojo); }
  .cab-head { display: flex; align-items: center; gap: 9px; }
  .cab-head b { flex: 1; font-family: var(--serif); font-size: 15px; font-weight: 600; }
  .cab-head i { font-style: normal; font-size: 11.5px; color: var(--teal); font-weight: 600; }
  .cruz { color: var(--rojo); font-size: 13px; flex-shrink: 0; }
  .lesion { flex: 1; font-size: 11px; color: var(--rojo); }
  .fila-lesion { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .sacar {
    background: none; border: none; color: var(--muted); font: inherit; font-size: 20px;
    line-height: 1; cursor: pointer; padding: 4px 8px; min-height: 32px;
  }
  .sacar:hover { color: var(--rojo); }
  /* La lesión es un interruptor con su palabra al lado: se aprieta cuando se
     lesiona y se destilda cuando se recupera. Una cruz sola no dice eso. */
  .marcar {
    display: flex; align-items: center; gap: 7px; background: none; border: none;
    font: inherit; font-size: 11px; color: var(--muted); cursor: pointer; padding: 4px 0; min-height: 36px;
  }
  .marcar .palanca {
    width: 38px; height: 22px; border-radius: 11px; background: var(--line);
    padding: 3px; display: flex; flex-shrink: 0; transition: background .15s;
  }
  .marcar .palanca::after { content: ''; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
  .marcar.activa { color: var(--rojo); }
  .marcar.activa .palanca { background: var(--rojo); justify-content: flex-end; }
  .chuks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .chuk {
    width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--ground); color: var(--muted); font: inherit; font-size: 13px; cursor: pointer;
  }
  .chuk.medio { width: 42px; font-size: 12px; }
  .chuk[data-estado="mio"] { background: var(--teal); border-color: var(--teal); color: var(--sobre-color); font-weight: 700; }
  .chuk[data-estado="otro"] { opacity: .35; }

  /* --- los chukkers jugados fuera del club --- */
  /* La casilla no es un lugar más de la práctica: va al final, más ancha, con
     la palabra, y separada de las seis por una raya. */
  .chuk.extra, .chuk.ancho { width: auto; padding: 0 13px; font-size: 12px; letter-spacing: .4px; }
  .chuk.extra[data-estado="cargado"] { border-color: var(--teal); color: var(--teal); font-weight: 600; }
  /* El botón que parte los chukkers al medio para un caballo. Prendido no se
     pinta entero como una casilla puesta: no es un lugar, es un modo. */
  .chuk.ancho[data-estado="mio"] {
    background: rgba(0,137,122,.09); border-color: var(--teal); color: var(--teal); font-weight: 700;
  }
  /* Un chukker que ya tiene medio tomado por otro caballo: se pinta la mitad
     para que se vea que está ocupado, sin mentir que lo está entero. */
  .chuk.a-medias {
    background: linear-gradient(to right, rgba(107,120,145,.28) 0 50%, transparent 50% 100%);
  }
  .sep-chuk { width: 1px; height: 26px; background: var(--line); margin: 0 3px; align-self: center; }
  .extra-panel { background: var(--surface); border-radius: 10px; padding: 12px 12px 4px; margin-top: 10px; }
  .extra-panel .acciones { margin-top: 4px; }
  .extra-fila { display: flex; align-items: baseline; gap: 9px; padding: 5px 0; }
  .extra-fila + .extra-fila { border-top: 1px solid var(--line); }
  .extra-fila b { font-family: var(--serif); font-size: 13px; font-weight: 600; }
  .extra-fila span { font-size: 12.5px; color: var(--teal); font-weight: 600; }
  .extra-fila em { font-style: normal; font-size: 11.5px; color: var(--muted); flex: 1; }
  .extra-fila .sacar { font-size: 17px; padding: 0 4px; min-height: 0; }
  /* La referencia del punto, abajo del texto del calendario. */
  .ref-afuera { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted); margin: 0 0 10px; }
  .ref-afuera svg { flex: none; }

  .puntaje { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .puntaje span { font-size: 11px; color: var(--muted); flex: 1; }
  .puntaje select { width: auto; min-width: 78px; }
  .guardado { font-size: 11px; color: var(--teal); text-align: right; margin: 6px 0 0; }
  .guardado.mal { color: var(--rojo); }
  /* Los números de la temporada, en un solo bloque partido por filetes. */
  .numeros { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 12px; }
  .numeros.p { padding: 0; }
  .numeros > div { text-align: center; padding: 12px 6px; border-right: 1px solid var(--line); }
  .numeros > div:last-child { border-right: none; }
  .numeros.dos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .numeros.seis > div:nth-child(-n+3) { border-bottom: 1px solid var(--line); }
  .numeros.seis > div:nth-child(3n) { border-right: none; }
  .numeros b { display: block; font-size: 22px; font-weight: 600; line-height: 1.1; }
  .numeros b.teal { color: var(--teal); }
  .numeros b.oro { color: var(--gold); }
  .numeros span { display: block; font-size: 9px; font-weight: 600; letter-spacing: 1.1px; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  .puesto-nro { width: 22px; text-align: center; font-size: 11px; color: var(--muted); flex-shrink: 0; }
  .puesto-nro.podio { color: var(--gold); font-weight: 700; }
  .hcp.teal { color: var(--teal); font-weight: 600; }

  /* --- resultados y ranking --- */
  .marcador { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 13px; }
  .marcador b { font-size: 17px; }
  .marcador .franja { font-size: 10px; color: var(--muted); min-width: 62px; }
  .lado { font-size: 11px; letter-spacing: 1.2px; }
  .lado.ganador { font-weight: 700; }
  .color.azul { color: var(--azul); }
  .color.blanco { color: var(--blanco); }
  .color.colorado { color: var(--colorado); }
  .color.bicolor { color: var(--gold); }
  .mvp { display: flex; gap: 10px; align-items: center; margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
  .mvp span { font-size: 10px; letter-spacing: 2px; color: var(--gold); }
  .cargar-gol { margin-bottom: 12px; }
  .cargar-gol .franja { font-size: 10px; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 5px; }
  .cargar-gol .fila { align-items: center; }
  .cargar-gol input { width: 62px; text-align: center; padding: 10px 4px; }
  .cargar-gol .lado { min-width: 62px; }
  .cargar-gol .guion { color: var(--muted); }

  .cabecera-ranking { display: flex; align-items: center; gap: 10px; padding: 7px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .cabecera-ranking .hueco { flex: 1; }
  .cabecera-ranking .col {
    width: 42px; background: none; border: none; color: var(--muted); font: inherit;
    font-size: 9.5px; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase; cursor: pointer;
    padding: 4px 0; text-align: right; min-height: 28px;
  }
  .cabecera-ranking .col[aria-pressed="true"] { color: var(--teal); }
  .fila-ranking .num { width: 42px; text-align: right; font-size: 13px; color: var(--muted); flex-shrink: 0; }
  .fila-ranking .num.fuerte { color: var(--teal); font-weight: 600; font-size: 15px; }
  .fila-ranking.yo { background: rgba(0,137,122,.05); }

  .ficha { display: flex; align-items: center; gap: 12px; border: none; padding: 0; }
  .ficha .inicial {
    width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
    background: rgba(0,137,122,.10); color: var(--teal);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-size: 17px; font-weight: 600;
  }
  .ficha b { display: block; font-family: var(--serif); font-size: 21px; font-weight: 600; color: var(--teal); line-height: 1.15; }
  .ficha > div > span { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .como-viene { display: flex; flex-direction: column; align-items: center; gap: 2px; flex-shrink: 0; }
  .como-viene span { font-size: 9.5px; letter-spacing: .4px; color: var(--muted); white-space: nowrap; }
  .fila-ranking .flecha { flex-shrink: 0; }
  /* El handicap interno con su ajuste: solo lo ve un administrador. */
  .hcp-interno { display: flex; align-items: baseline; gap: 10px; margin-top: 10px; }
  .hcp-interno .campo-chico { font-size: 9.5px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; color: var(--muted); }
  .hcp-interno b { font-size: 19px; font-weight: 600; color: var(--teal); }
  .hcp-interno em { font-style: normal; font-size: 11px; color: var(--muted); flex: 1; text-align: right; }

  /* Canchas, con el redondel del número como en la v1. */
  /* La cancha es un botón y el total un div: `width:100%` los deja exactamente
     del mismo ancho. `text-align:left` porque un botón centra solo. */
  .cancha-fila {
    display: flex; align-items: center; gap: 14px; padding: 12px 14px; margin-bottom: 8px;
    width: 100%; text-align: left; font: inherit; color: inherit;
  }
  .cancha-fila b { font-family: var(--serif); font-size: 16px; font-weight: 600; }
  .redondel {
    width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0; font-size: 20px; font-weight: 700;
    background: linear-gradient(135deg, var(--teal), #008f7a); color: var(--sobre-color);
    display: flex; align-items: center; justify-content: center;
  }
  .insignias { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .cancha-fila .grande { font-size: 22px; font-weight: 700; color: var(--teal); display: block; }
  .cancha-fila em { font-style: normal; font-size: 11px; color: var(--muted); }
  .cancha-fila .chico { font-size: 13px; color: var(--ink); font-weight: 700; margin-top: 3px; white-space: nowrap; }
  /* La temporada entera, con la misma forma que una cancha pero destacada. */
  .cancha-fila.total { border-color: var(--teal); background: rgba(0,137,122,.06); }
  .cancha-fila.total > div > b { text-transform: uppercase; letter-spacing: .5px; }
  .redondel.rotulo { font-size: 11px; letter-spacing: .5px; background: linear-gradient(135deg, #00695f, var(--teal)); }
  .renglon-dato { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .renglon-dato b { font-size: 14px; }
  .renglon-dato + .renglon-dato { border-top: 1px solid var(--line); }
  .renglon-dato em { display: block; font-style: normal; font-size: 10px; color: var(--muted); letter-spacing: 1px; }
  .renglon-dato b { display: block; font-size: 14px; margin-top: 2px; }
  /* Seis canchas, seis casilleros: en fila siempre, aunque juegue en dos. */
  .canchas { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .cancha {
    background: var(--ground); border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 2px; text-align: center;
  }
  .cancha b { display: block; font-size: 15px; font-weight: 600; color: var(--teal); }
  .cancha span { display: block; font-size: 12px; margin-top: 1px; }
  .cancha em { display: block; font-style: normal; font-size: 9.5px; color: var(--muted); }

  /* --- una práctica en la lista, como la planilla de la v1 --- */
  .practica { margin-bottom: 8px; overflow: hidden; }
  .practica.plegada .practica-cabecera { background: var(--ground); border-bottom: none; }
  .practica-cabecera {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: var(--surface); border: none; border-bottom: 1px solid var(--line);
    padding: 10px 14px; cursor: pointer; font: inherit; color: var(--ink); min-height: 58px;
  }
  .practica-cabecera b { display: block; font-family: var(--serif); font-size: 14.5px; font-weight: 600; }
  .practica-cabecera > span > span { display: block; font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .practica-cabecera .flecha { color: #9aa5b8; flex-shrink: 0; display: block; }
  .marcadores { display: flex; flex-direction: column; gap: 2px; align-items: flex-end; flex-shrink: 0; }
  .practica-cabecera .marcadores > span { display: flex; gap: 4px; align-items: baseline; font-size: 15px; font-weight: 600; white-space: nowrap; }
  /* El mes, como separador de la temporada. */
  .mes {
    display: flex; align-items: center; gap: 9px; margin: 20px 0 9px;
    font-size: 10px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--gold);
  }
  .mes .raya { flex: 1; height: 1px; background: var(--line); }
  .mes em { font-style: normal; color: var(--muted); font-weight: 400; letter-spacing: 0; font-size: 10.5px; text-transform: none; }
  .marcadores i { font-style: normal; color: var(--muted); font-size: 12px; }
  .guion { font-style: normal; color: var(--muted); }
  /* Los goles van adentro del renglón, no cada número en su propia línea:
     `.quien b` es block porque ahí vive el nombre, y acá manda el renglón. */
  .quien .color, .quien .guion { display: inline; font-size: 12px; font-weight: 700; }
  .equipos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); }
  .equipo-col { padding: 10px 12px; border-right: 1px solid var(--line); }
  .equipo-col:last-child { border-right: none; }
  .equipo-col h4 { margin: 0 0 6px; font-size: 9.5px; letter-spacing: 1.5px; font-weight: 700; }
  .renglon-jug { display: flex; justify-content: space-between; gap: 6px; font-family: var(--serif); font-size: 12.5px; padding: 2px 0; }
  .renglon-jug em { font-style: normal; color: var(--muted); font-size: 11px; font-family: var(--sans); }
  .pie-practica {
    display: flex; align-items: center; gap: 7px; padding: 8px 14px; font-size: 9.5px;
    font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
    border-top: 1px solid var(--line); color: var(--gold); background: var(--surface);
  }
  .pie-practica b { color: var(--ink); font-family: var(--serif); font-size: 13px; letter-spacing: 0; text-transform: none; }
  .estrella { color: var(--gold); display: block; flex-shrink: 0; }
  .practica-cabecera .marcadores > span.mvp-chico {
    display: flex; align-items: center; gap: 4px;
    font-family: var(--serif); font-size: 11.5px; color: var(--muted); font-weight: 400;
  }
  .ver-planilla {
    display: flex; align-items: center; gap: 4px; background: none; border: none; cursor: pointer;
    font: inherit; font-size: 11.5px; font-weight: 600; letter-spacing: 0; text-transform: none;
    color: var(--teal); padding: 6px 0 6px 10px; min-height: 32px;
  }

  /* --- el calendario de la caballada ---
     Los nombres quedan quietos a la izquierda y la grilla se desliza: la
     temporada entera no entra en un celular, pero saber de qué caballo es
     cada renglón no puede depender de dónde quedó el dedo. */
  .calendario { display: flex; align-items: flex-start; margin-top: 4px; }
  .calendario-nombres { flex: 0 0 auto; width: 74px; padding-right: 8px; }
  .nombre-fila {
    height: 24px; line-height: 14px; font-family: var(--serif); font-size: 10px;
    color: var(--ink); text-align: right;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .nombre-fila.lesionado { color: var(--rojo); }
  .calendario-grilla {
    flex: 1 1 auto; min-width: 0; overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch; padding-bottom: 2px;
  }
  .grilla { display: block; }
  .grilla .eje { font-family: var(--serif); font-size: 9px; fill: var(--muted); }
  .grilla .clicable { cursor: pointer; }
  .grilla .clicable:hover { opacity: .78; }
  .detalle-grafico {
    font-size: 12px; color: var(--muted); margin: 8px 0 0; min-height: 18px;
    border-top: 1px solid var(--line); padding-top: 8px;
  }
  .referencia { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; align-items: center; }
  .titulo-ref { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
  .llave { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .llave i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .llave i.barra { height: 3px; border-radius: 1.5px; }
  .llave i.rayita { width: 2px; height: 13px; border-radius: 1px; }

  .aviso { border-radius: 9px; padding: 12px 14px; font-size: 13px; margin-top: 12px; }
  .aviso.mal { background: rgba(198,40,40,.07); border: 1px solid var(--rojo); color: var(--rojo); }
  .aviso.nota { background: var(--ground); border: 1px solid var(--line); color: var(--muted); }
  .aviso.ok { background: rgba(0,137,122,.07); border: 1px solid var(--teal); color: var(--teal); }

  /* El cartel de cumpleaños del plantel. */
  .cumple {
    display: flex; align-items: center; gap: 11px; margin-bottom: 12px;
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; color: var(--muted);
  }
  .cumple b { display: block; font-family: var(--serif); font-size: 14px; font-weight: 600; color: var(--ink); }
  .cumple span { display: block; font-size: 11px; margin-top: 1px; }
  .cumple svg { flex-shrink: 0; color: var(--gold); }
  .cumple.hoy { border-color: var(--rojo); background: rgba(198,40,40,.05); }
  .cumple.hoy svg, .cumple.hoy b { color: var(--rojo); }
  /* El día que alguien cumple, la solapa del plantel se pone en rojo. */
  .pestana .de-cumple { color: var(--rojo); }
  /* Cuánto le movieron el handicap interno los resultados: la flecha con su
     número a la izquierda, chica; el handicap de hoy a la derecha, grande. */
  .ajuste {
    display: inline-flex; align-items: center; gap: 2px;
    font-size: 11px; font-weight: 700; flex-shrink: 0;
  }
  .ajuste b { font-weight: 700; font-variant-numeric: tabular-nums; }
  .ajuste.sube { color: #0f8a4a; }
  .ajuste.baja { color: var(--rojo); }
  .hcp-actual {
    font-size: 17px; font-weight: 600; color: var(--teal);
    min-width: 34px; text-align: right; flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  /* --- el gráfico de uso de canchas --- */
  svg.grafico { display: block; width: 100%; height: auto; overflow: visible; }
  .grafico .eje { font-size: 11px; fill: var(--muted); font-family: var(--sans); }
  /* La primera semana de cada mes va marcada. Se llama "primero" y no "mes"
     porque esa clase ya la usa el separador de la lista de prácticas, que va
     en versalitas y en dorado. */
  .grafico .eje.primero { font-weight: 700; fill: var(--ink); }
  .grafico .grilla { stroke: var(--linea-suave); stroke-width: 1; }
  .grafico .base { stroke: var(--line); stroke-width: 1; }
  .grafico .linea { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .grafico .punto-partido { stroke: none; }

  .refs-canchas { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 0 2px 10px; }
  .ref-cancha { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
  .ref-cancha i { width: 14px; height: 3px; border-radius: 2px; display: block; }
  .ref-cancha b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .ref-cancha.apagada { opacity: .5; }

  .renglon-cancha { display: flex; align-items: center; gap: 8px; padding: 2px 2px; }
  .renglon-cancha + .renglon-cancha { border-top: 1px solid var(--linea-suave); }
  .renglon-cancha.apagada .renglon-rotulo { color: var(--muted); }
  .renglon-rotulo {
    flex: none; width: 62px; display: flex; align-items: baseline; gap: 5px;
    font-size: 12px; font-weight: 600; color: var(--ink);
  }
  .renglon-rotulo i { width: 9px; height: 9px; border-radius: 3px; display: block; flex: none; }
  .renglon-rotulo b { margin-left: auto; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  .renglon-cancha svg { flex: 1; min-width: 0; }
  .renglon-eje { border-top: 0; }

  /* El cuadro de números se corre para el costado; la columna de la cancha
     queda clavada, que si no uno se pierde de qué renglón es cada número. */
  .rodante { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .rodante table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
  .rodante th, .rodante td {
    padding: 7px 8px; text-align: right; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .rodante th:first-child, .rodante td:first-child {
    text-align: left; position: sticky; left: 0; background: var(--ground); padding-left: 2px;
  }
  .rodante thead th {
    font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); font-weight: 700; border-bottom: 1px solid var(--line);
  }
  .rodante tbody tr + tr td { border-top: 1px solid var(--linea-suave); }
  .rodante tfoot td { border-top: 1px solid var(--line); font-weight: 700; }
  .punto-cancha {
    display: inline-block; width: 10px; height: 10px; border-radius: 3px;
    margin-right: 7px; vertical-align: -1px;
  }
  .banda-lluvia { fill: #2a78d6; opacity: .22; }
  .mm-lluvia { fill: #2a78d6; font-weight: 700; font-size: 10px; font-family: var(--sans); }
  .sub-total {
    display: block; font-size: 10.5px; font-weight: 600; margin-top: 2px;
    text-transform: none; letter-spacing: 0;
  }
  .parcial { display: block; font-size: 10.5px; font-weight: 600; margin-top: 1px; }
  .fila-lluvia td { color: #2a78d6; font-weight: 600; }
  .fila-lluvia td:first-child {
    color: var(--muted); font-weight: 700; font-size: 11px;
    letter-spacing: .06em; text-transform: uppercase;
  }
  /* Los dos trabajos que el club hace siempre, en colores que se leen sobre
     blanco: 5,9:1 el marrón de la arena y 7,1:1 el verde del fertilizante. */
  .arena { color: #8a5a2b; }
  .fert { color: #166534; }
  .otro-trabajo { color: var(--muted); }

  /* --- el estado de cada cancha --- */
  .cancha-fila.abierta {
    border-color: var(--teal); margin-bottom: 0;
    border-bottom-left-radius: 0; border-bottom-right-radius: 0;
  }
  .cancha-fila .flechita { color: var(--muted); flex-shrink: 0; }
  .desplegado {
    border: 1px solid var(--teal); border-top: 0; border-radius: 0 0 14px 14px;
    background: var(--surface); padding: 12px 14px 10px; margin-bottom: 8px;
  }
  .totales-trabajo { display: flex; gap: 18px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .totales-trabajo > div { display: flex; align-items: baseline; gap: 5px; }
  .totales-trabajo b { font-size: 19px; font-weight: 700; }
  .totales-trabajo span { font-size: 11px; color: var(--muted); }
  .trabajo { display: flex; align-items: baseline; gap: 8px; padding: 7px 0; font-size: 13px; }
  .trabajo + .trabajo { border-top: 1px solid var(--linea-suave); }
  .trabajo .cuando { color: var(--muted); font-size: 12px; width: 62px; flex: none; }
  .trabajo .que { flex: 1; min-width: 0; }
  .trabajo .cuanto { font-weight: 700; }

  /* --- los días de lluvia --- */
  /* Un título con su número a la derecha, en el mismo renglón. */
  .titulo-con-total { display: flex; align-items: baseline; gap: 10px; }
  .titulo-con-total h2 { flex: 1; }
  .titulo-con-total em {
    font-style: normal; font-size: 11.5px; color: var(--muted); white-space: nowrap;
  }
  /* En pastillas y no en renglones: una temporada tiene veinte o treinta días
     de lluvia y en lista serían una página entera. */
  .lluvias { display: flex; flex-wrap: wrap; gap: 7px; }
  .lluvia-dia {
    display: flex; align-items: baseline; gap: 6px;
    border: 1px solid var(--line); border-radius: 9px; background: var(--surface);
    padding: 5px 5px 5px 10px;
  }
  .lluvia-dia b { font-size: 13px; font-weight: 700; }
  .lluvia-dia em { font-style: normal; font-size: 11.5px; color: var(--azul); font-weight: 600; }
  .lluvia-dia .sacar { font-size: 16px; padding: 0 4px; min-height: 0; }

  /* --- las observaciones --- */
  .obs {
    border: 1px solid var(--line); border-radius: 12px; background: var(--ground);
    padding: 11px 13px; margin-bottom: 8px;
  }
  .obs-cabeza { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .obs-cabeza b { font-family: var(--serif); font-size: 14px; font-weight: 600; }
  .obs-cabeza .cuando { color: var(--muted); font-size: 12px; margin-left: auto; }
  .obs-canchas { display: flex; gap: 4px; }
  .obs-canchas span {
    font-size: 10.5px; font-weight: 700; border-radius: 5px; padding: 2px 6px; line-height: 1.5;
  }
  .obs p { margin: 0; font-size: 13.5px; color: var(--ink); white-space: pre-wrap; }
  .campo textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 12px;
    font: inherit; font-size: 15px; color: var(--ink); min-height: 92px; resize: vertical;
  }
  .con-unidad { display: flex; align-items: center; gap: 8px; }
  .con-unidad input { flex: 1; min-width: 0; }
  .con-unidad em { font-style: normal; color: var(--muted); font-size: 13px; white-space: nowrap; }

  /* El marcador del partido de torneo, en el alta. */
  .marcador-alta { display: flex; align-items: center; gap: 8px; }
  .marcador-alta input { width: 64px; text-align: center; padding: 10px 4px; }
  .marcador-alta span { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .marcador-alta span:first-child { text-align: right; flex: 1; }
  .marcador-alta span:last-child { flex: 1; }

  /* El sello del organizador del torneo, en la ficha del jugador. */
  .sello-organizador {
    font-size: 9.5px; font-weight: 700; letter-spacing: 1.2px; padding: 4px 8px;
    border-radius: 4px; white-space: nowrap; flex-shrink: 0;
  }
  .resultado-torneo { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .resultado-torneo.gano { color: #0f8a4a; }
  .resultado-torneo.empato { color: var(--muted); }
  .resultado-torneo.perdio { color: var(--rojo); }

  .vacio { text-align: center; color: var(--muted); font-size: 13px; padding: 30px 14px; }
  .pill { font-size: 10px; letter-spacing: 1.5px; padding: 4px 9px; border-radius: 4px; }
  .pill.admin { background: rgba(160,119,34,.13); color: var(--gold); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<!-- La franja de la copia de prueba. Arranca escondida y la prende el servidor
     con la variable AMBIENTE: en la app del club nunca se ve. -->
<div id="franja-prueba" hidden>
  <b>VERSIÓN DE PRUEBA</b>
  <span>Lo que cargues acá no llega al club</span>
</div>

<header>
  <div class="head-in">
    <img class="mark" src="/iconos/logo-192.png" alt="Escudo del Club de Campo San Diego">
    <div class="brand"><b>SAN DIEGO</b><span id="subtitulo">Club de Campo</span></div>
    <div id="chip-admin"></div>
  </div>
</header>

<main class="wrap" id="app">
  <div class="vacio">Cargando…</div>
</main>

<!-- El `?v=` es lo que hace que el celular baje el código nuevo en vez de usar
     el que tenía guardado. Cambia con cada versión que se publica, junto con
     `lib/version.js`. Sin esto, uno sube los archivos y sigue viendo la app
     vieja hasta que se le ocurre limpiar el navegador. -->
<script src="logo.js?v=2026.09.23"></script>
<script src="hoja.js?v=2026.09.23"></script>
<script src="comun.js?v=2026.09.23"></script>
<script src="caballos.js?v=2026.09.23"></script>
<script src="usocanchas.js?v=2026.09.23"></script>
<script src="ranking.js?v=2026.09.23"></script>
<script src="anotacion.js?v=2026.09.23"></script>
<script src="armar.js?v=2026.09.23"></script>
<script>
/* ------------------------------------------------------------------ entrar */

const app = document.getElementById('app');
let plantelPublico = [];
let quien = null;
// Si esta copia se entra con una llave compartida. Lo dice el servidor; en la
// app del club siempre es false.
let conLlave = false;
let filtro = '';

function pantallaNombre(mensaje) {
  vaciar(app);
  app.appendChild(titulo('Quién sos'));

  const buscar = el('input', {
    type: 'text', placeholder: 'Buscar tu nombre…', value: filtro,
    oninput: (e) => { filtro = e.target.value; dibujarLista(); },
  });
  app.appendChild(buscar);

  const lista = el('div', { class: 'lista tabla', style: 'margin-top:10px' });
  app.appendChild(lista);

  function dibujarLista() {
    vaciar(lista);
    const texto = filtro.trim().toLowerCase();
    const visibles = plantelPublico.filter((j) =>
      !texto || j.apodo.toLowerCase().includes(texto) || j.nombre.toLowerCase().includes(texto));

    if (!visibles.length) {
      lista.appendChild(el('div', { class: 'vacio' }, ['No hay nadie con ese nombre.']));
      return;
    }
    visibles.forEach((j) => {
      lista.appendChild(el('button', {
        class: 'quien', type: 'button',
        onclick: () => { quien = j; pantallaPin(); },
      }, [
        el('span', { style: 'flex:1' }, [
          el('b', {}, [j.apodo]),
          el('span', {}, [j.nombre]),
        ]),
        // Con llave compartida, "NUEVO" no significa nada: nadie da de alta su PIN.
        (j.activado || conLlave) ? null : el('span', { class: 'marca' }, ['NUEVO']),
      ]));
    });
  }
  dibujarLista();

  if (mensaje) app.appendChild(aviso('nota', mensaje));
}

function pantallaPin(errorTexto) {
  vaciar(app);
  // En la copia de prueba con llave no se da de alta ningún PIN: se entra con
  // el que te pasaron, tenga o no tenga PIN propio ese jugador.
  const primeraVez = !quien.activado && !conLlave;

  app.appendChild(titulo(primeraVez ? 'Elegí tu PIN' : 'Tu PIN'));
  app.appendChild(el('div', { class: 'card', style: 'padding:13px 15px;margin-bottom:14px' }, [
    el('div', { style: 'font-size:15px;font-weight:600' }, [quien.apodo]),
    el('div', { style: 'font-size:12px;color:var(--muted);margin-top:2px' }, [quien.nombre]),
  ]));

  const pin = el('input', {
    class: 'pin', type: 'tel', inputmode: 'numeric', maxlength: '4',
    autocomplete: 'off', placeholder: '••••', 'aria-label': 'PIN de 4 números',
  });
  pin.addEventListener('input', () => {
    pin.value = pin.value.replace(/\D/g, '').slice(0, 4);
    entrar.disabled = pin.value.length !== 4;
  });
  pin.addEventListener('keydown', (e) => { if (e.key === 'Enter' && pin.value.length === 4) mandar(); });
  app.appendChild(pin);

  const entrar = el('button', {
    class: 'primary', type: 'button', disabled: true, style: 'margin-top:14px',
    onclick: () => mandar(),
  }, [primeraVez ? 'Guardar y entrar' : 'Entrar']);
  app.appendChild(entrar);

  app.appendChild(el('div', { style: 'text-align:center;margin-top:6px' }, [
    el('button', { class: 'link', type: 'button', onclick: () => { quien = null; pantallaNombre(); } }, ['No soy yo']),
  ]));

  if (errorTexto) app.appendChild(aviso('mal', errorTexto));
  else if (conLlave) {
    app.appendChild(aviso('nota',
      'Esta es la versión de prueba: entrá con el PIN que te pasaron. No es tu PIN del club y no se guarda nada tuyo acá.'));
  } else if (primeraVez) {
    app.appendChild(aviso('nota',
      'Es tu primera vez: el PIN que pongas ahora queda como el tuyo. Elegí cuatro números que te acuerdes — si te lo olvidás, te lo resetea un administrador.'));
  }

  setTimeout(() => pin.focus(), 60);

  async function mandar() {
    entrar.disabled = true;
    entrar.textContent = 'Entrando…';
    try {
      const r = await pedir('/api/login', {
        method: 'POST',
        body: JSON.stringify({ jugadorId: quien.id, pin: pin.value }),
      });
      const sesion = await pedir('/api/sesion').catch(() => ({ jugador: r.jugador }));
      // Recién acá se sabe qué trae esta copia —la franja y si Anotación está
      // prendida—: la pantalla de entrada no tiene sesión para preguntarlo.
      marcarAmbiente(sesion);
      if (sesion.jugador && sesion.jugador.faltaNacimiento) {
        pantallaNacimiento(sesion);
        return;
      }
      adentro(sesion.jugador || r.jugador, sesion.temporada, sesion.cumples);
    } catch (e) {
      pantallaPin(e.message);
    }
  }
}

/**
 * La fecha de nacimiento, una sola vez. El club la usa para saludar el día del
 * cumpleaños; se la ve un administrador y nadie más. Se puede dejar para
 * después: nadie se queda afuera de la app por esto.
 */
function pantallaNacimiento(sesion, errorTexto) {
  vaciar(app);
  app.appendChild(titulo('¿Cuándo cumplís años?'));
  app.appendChild(el('p', { class: 'pista' }, [
    'Es para que el club te salude. La ven los administradores y nadie más. '
    + 'Se carga una sola vez.',
  ]));

  const fecha = el('input', { type: 'date', max: hoy(), 'aria-label': 'Fecha de nacimiento' });
  app.appendChild(el('div', { style: 'margin-top:14px' }, [fecha]));

  if (errorTexto) app.appendChild(aviso('mal', errorTexto));

  const seguir = el('button', { class: 'primary', type: 'button', style: 'margin-top:14px' }, ['Listo']);
  seguir.addEventListener('click', async () => {
    if (!fecha.value) { pantallaNacimiento(sesion, 'Elegí la fecha o dejalo para después.'); return; }
    seguir.disabled = true;
    seguir.textContent = 'Guardando…';
    try {
      await pedir('/api/sesion', {
        method: 'POST',
        body: JSON.stringify({ fechaNacimiento: fecha.value }),
      });
      const fresca = await pedir('/api/sesion');
      adentro(fresca.jugador, fresca.temporada, fresca.cumples);
    } catch (e) {
      pantallaNacimiento(sesion, e.message);
    }
  });
  app.appendChild(seguir);

  app.appendChild(el('div', { style: 'text-align:center;margin-top:6px' }, [
    el('button', {
      class: 'link', type: 'button',
      onclick: () => adentro(sesion.jugador, sesion.temporada, sesion.cumples),
    }, ['Lo cargo después']),
  ]));
}

/* ---------------------------------------------------------------- arranque */

/**
 * Prende la franja si el servidor dice que esta es la copia de prueba. Se llama
 * con lo que conteste cualquiera de las dos puertas de entrada —`/api/sesion` o
 * `/api/plantel`—, así la franja está desde la primera pantalla y no recién
 * después de entrar.
 */
function marcarAmbiente(respuesta) {
  if (respuesta && respuesta.ambiente === 'prueba') {
    document.getElementById('franja-prueba').hidden = false;
    document.title = 'PRUEBA · San Diego Polo';
  }
  // Y si esta copia tiene prendida la solapa Anotación. Lo dice el servidor
  // porque depende de una variable de Vercel, no del código.
  if (respuesta && respuesta.conAnotacion !== undefined) {
    estado.conAnotacion = !!respuesta.conAnotacion;
  }
}

(async function arrancar() {
  try {
    const sesion = await pedir('/api/sesion');
    marcarAmbiente(sesion);
    if (sesion.jugador.faltaNacimiento) pantallaNacimiento(sesion);
    else adentro(sesion.jugador, sesion.temporada, sesion.cumples);
    return;
  } catch (e) { /* sin sesión: a elegir nombre */ }

  try {
    const r = await pedir('/api/plantel');
    marcarAmbiente(r);
    conLlave = !!r.conLlave;

    pantallaNombre();
